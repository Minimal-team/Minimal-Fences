name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore MinimalFences.slnx --locked-mode

      - name: Build
        run: dotnet build MinimalFences.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/MinimalFences.Core.Tests -c Release --no-build --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Publish self-contained Windows x64 application
        run: dotnet publish src/MinimalFences.App -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o artifacts/publish

      - name: Verify WPF windows and Shell icon loading
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $PWD 'TestResults/ui-smoke.json'
          $process = Start-Process -FilePath artifacts/publish/MinimalFences.exe -ArgumentList ('--smoke-test "{0}"' -f $report) -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'WPF smoke test timed out' }
          $process.Refresh()
          if (!(Test-Path $report)) { throw 'WPF smoke test did not produce a report' }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$result.passed) { throw 'WPF smoke test failed' }

      - name: Verify, package and calculate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('MinimalFences.exe', 'MinimalFences.dll', 'coreclr.dll', 'PresentationFramework.dll')) {
            if (!(Test-Path "artifacts/publish/$file")) { throw "Missing publish output: $file" }
          }
          Copy-Item README.md artifacts/publish/README.md
          if (Test-Path docs) {
            New-Item -ItemType Directory -Force artifacts/publish/docs | Out-Null
            Copy-Item docs/*.md artifacts/publish/docs/
          }
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/MinimalFences-win-x64.zip
          $hash = (Get-FileHash -Path artifacts/MinimalFences-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path artifacts/MinimalFences-win-x64.zip.sha256 -Value "$hash *MinimalFences-win-x64.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinimalFences-win-x64
          path: |
            artifacts/MinimalFences-win-x64.zip
            artifacts/MinimalFences-win-x64.zip.sha256
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/ui-smoke.json
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MinimalFences-win-x64.zip
            artifacts/MinimalFences-win-x64.zip.sha256
          generate_release_notes: true
